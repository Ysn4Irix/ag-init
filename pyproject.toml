[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ag-init"
version = "0.1.1"
description = "Automated workspace initializer for Google Antigravity and Gemini CLI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team" }
]
keywords = ["antigravity", "gemini", "agents", "antislop", "cli", "scaffolding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
ag-init = "ag_init.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_init"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
